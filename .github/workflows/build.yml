name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk grain-moisture.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Grain Moisture 1.0.${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            ${{ github.event.head_commit.message }}
          make_latest: true
          files: grain-moisture.apk
